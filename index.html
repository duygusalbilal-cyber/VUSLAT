<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>VUSLAT</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0c0c0e;
      --bg-card: #161618;
      --bg-elevated: #1e1e22;
      --border: #2a2a2e;
      --text: #f4f4f5;
      --text-secondary: #a1a1aa;
      --accent: #d4af37;
      --accent-soft: rgba(212, 175, 55, 0.15);
      --danger: #ef4444;
      --like: #ef4444;
      --radius: 16px;
      --radius-sm: 12px;
      --shadow: 0 4px 24px rgba(0,0,0,0.4);
      --nav-width: 260px;
      --right-width: 340px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      overflow-x: hidden;
    }
    .logo { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 24px; letter-spacing: -0.5px; }
    .logo span { background: linear-gradient(135deg, #fff 0%, var(--accent) 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .app { display: grid; grid-template-columns: var(--nav-width) 1fr var(--right-width); min-height: 100vh; max-width: 1600px; margin: 0 auto; }
    .left-nav { position: sticky; top: 0; height: 100vh; padding: 24px 16px; border-right: 1px solid var(--border); display: flex; flex-direction: column; gap: 8px; background: var(--bg); }
    .nav-item { display: flex; align-items: center; gap: 16px; padding: 14px 16px; border-radius: var(--radius-sm); color: var(--text); text-decoration: none; font-weight: 600; font-size: 16px; transition: all 0.2s; cursor: pointer; }
    .nav-item:hover, .nav-item.active { background: var(--bg-elevated); }
    .nav-item.active { color: var(--accent); }
    .nav-item svg { width: 26px; height: 26px; flex-shrink: 0; }
    .create-btn { margin-top: 16px; background: linear-gradient(135deg, var(--accent) 0%, #b8860b 100%); color: #000; font-weight: 700; border: none; padding: 14px; border-radius: var(--radius-sm); cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .main { padding: 0 24px 80px; max-width: 680px; margin: 0 auto; width: 100%; }
    .top-bar { display: none; position: sticky; top: 0; z-index: 50; background: rgba(12,12,14,0.9); backdrop-filter: blur(20px); padding: 12px 16px; border-bottom: 1px solid var(--border); align-items: center; justify-content: space-between; }
    .stories { display: flex; gap: 16px; padding: 20px 0; overflow-x: auto; scrollbar-width: none; }
    .stories::-webkit-scrollbar { display: none; }
    .story { display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer; flex-shrink: 0; width: 76px; }
    .story-ring { width: 72px; height: 72px; border-radius: 50%; padding: 3px; background: linear-gradient(135deg, var(--accent), #f59e0b, #ec4899); }
    .story-avatar { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; border: 3px solid var(--bg); }
    .story-name { font-size: 12px; color: var(--text-secondary); width: 76px; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .post { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 24px; overflow: hidden; }
    .post-header { display: flex; align-items: center; gap: 12px; padding: 14px 16px; }
    .post-avatar { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; }
    .post-user { font-weight: 700; font-size: 15px; }
    .post-time { font-size: 13px; color: var(--text-secondary); margin-left: auto; }
    .post-image { width: 100%; aspect-ratio: 1 / 1; object-fit: cover; display: block; }
    .post-actions { display: flex; gap: 16px; padding: 12px 16px 8px; }
    .action-btn { background: none; border: none; color: var(--text); cursor: pointer; display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; padding: 6px; border-radius: 8px; }
    .action-btn.liked { color: var(--like); }
    .action-btn.liked svg { fill: var(--like); }
    .post-likes { padding: 0 16px; font-weight: 700; font-size: 14px; }
    .post-caption { padding: 8px 16px 12px; font-size: 14.5px; }
    .post-caption strong { font-weight: 700; }
    .comment-input-area { display: flex; gap: 10px; padding: 12px 16px; border-top: 1px solid var(--border); }
    .comment-input { flex: 1; background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 20px; padding: 10px 16px; color: var(--text); font-family: inherit; font-size: 14px; outline: none; }
    .send-comment { background: var(--accent); color: #000; border: none; border-radius: 20px; padding: 0 18px; font-weight: 700; cursor: pointer; }
    .right-sidebar { position: sticky; top: 0; height: 100vh; padding: 24px 16px; overflow-y: auto; border-left: 1px solid var(--border); }
    .profile-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; text-align: center; margin-bottom: 24px; }
    .profile-avatar { width: 80px; height: 80px; border-radius: 50%; object-fit: cover; margin-bottom: 12px; border: 3px solid var(--accent); }
    .profile-name { font-weight: 800; font-size: 18px; }
    .profile-handle { color: var(--text-secondary); font-size: 14px; margin-bottom: 16px; }
    .profile-stats { display: flex; justify-content: space-around; margin-top: 12px; font-size: 14px; }
    .profile-stats strong { display: block; font-size: 16px; }
    .suggestion-item { display: flex; align-items: center; gap: 12px; padding: 10px 0; }
    .suggestion-avatar { width: 44px; height: 44px; border-radius: 50%; object-fit: cover; }
    .follow-btn { background: none; border: none; color: var(--accent); font-weight: 700; font-size: 13px; cursor: pointer; }
    .bottom-nav { display: none; position: fixed; bottom: 0; left: 0; right: 0; background: rgba(12,12,14,0.95); backdrop-filter: blur(20px); border-top: 1px solid var(--border); padding: 8px 0 max(8px, env(safe-area-inset-bottom)); z-index: 100; justify-content: space-around; }
    .bottom-nav .nav-item { flex-direction: column; gap: 4px; padding: 6px 12px; font-size: 11px; font-weight: 600; }
    .bottom-nav .nav-item svg { width: 24px; height: 24px; }
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.75); z-index: 200; align-items: center; justify-content: center; backdrop-filter: blur(6px); }
    .modal-overlay.active { display: flex; }
    .modal { background: var(--bg-card); border-radius: var(--radius); width: 90%; max-width: 420px; max-height: 90vh; overflow: hidden; border: 1px solid var(--border); }
    .modal-header { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; border-bottom: 1px solid var(--border); font-weight: 700; }
    .modal-close { background: none; border: none; color: var(--text); font-size: 24px; cursor: pointer; }
    .modal-body { padding: 20px; }
    .auth-input { width: 100%; background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; color: var(--text); font-family: inherit; font-size: 15px; margin-bottom: 12px; outline: none; }
    .auth-input:focus { border-color: var(--accent); }
    .auth-btn { width: 100%; background: linear-gradient(135deg, var(--accent), #b8860b); color: #000; border: none; border-radius: 12px; padding: 14px; font-weight: 700; font-size: 15px; cursor: pointer; margin-top: 8px; }
    .auth-switch { text-align: center; margin-top: 16px; font-size: 14px; color: var(--text-secondary); }
    .auth-switch span { color: var(--accent); cursor: pointer; font-weight: 600; }
    .story-viewer { display: none; position: fixed; inset: 0; background: #000; z-index: 300; flex-direction: column; }
    .story-viewer.active { display: flex; }
    .story-progress { display: flex; gap: 4px; padding: 12px 16px 0; }
    .progress-bar { flex: 1; height: 3px; background: rgba(255,255,255,0.3); border-radius: 2px; overflow: hidden; }
    .progress-fill { height: 100%; width: 0%; background: #fff; }
    .story-content { flex: 1; display: flex; align-items: center; justify-content: center; position: relative; }
    .story-content img { max-width: 100%; max-height: 100%; object-fit: contain; }
    .story-header { position: absolute; top: 20px; left: 16px; right: 16px; display: flex; align-items: center; gap: 12px; color: #fff; z-index: 10; }
    .story-header img { width: 36px; height: 36px; border-radius: 50%; border: 2px solid #fff; }
    .story-close { position: absolute; top: 20px; right: 16px; background: none; border: none; color: #fff; font-size: 28px; cursor: pointer; z-index: 10; }
    .story-nav { position: absolute; top: 0; bottom: 0; width: 40%; cursor: pointer; }
    .story-nav.prev { left: 0; }
    .story-nav.next { right: 0; }
    .page-content { display: none; }
    .page-content.active { display: block; }
    .explore-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; padding: 8px 0; }
    .explore-item { aspect-ratio: 1; overflow: hidden; }
    .explore-item img { width: 100%; height: 100%; object-fit: cover; }
    .chat-item { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--border); cursor: pointer; }
    .chat-item:hover { background: var(--bg-elevated); }
    .profile-page { padding: 20px 0; }
    .profile-header { display: flex; align-items: center; gap: 20px; padding: 0 16px 20px; }
    .profile-header img { width: 90px; height: 90px; border-radius: 50%; border: 3px solid var(--accent); }
    .profile-posts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
    .profile-posts img { width: 100%; aspect-ratio: 1; object-fit: cover; }
    .search-bar { padding: 16px; }
    .search-bar input { width: 100%; background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 12px; padding: 12px 16px; color: var(--text); font-family: inherit; outline: none; }
    .toast { position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%) translateY(100px); background: var(--bg-elevated); color: var(--text); padding: 12px 24px; border-radius: 30px; font-weight: 600; font-size: 14px; border: 1px solid var(--border); opacity: 0; transition: all 0.3s; z-index: 400; pointer-events: none; }
    .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
    .logout-btn { margin-top: auto; background: none; border: 1px solid var(--border); color: var(--text-secondary); padding: 12px; border-radius: var(--radius-sm); cursor: pointer; font-weight: 600; }
    @media (max-width: 1100px) { .app { grid-template-columns: var(--nav-width) 1fr; } .right-sidebar { display: none; } }
    @media (max-width: 768px) {
      .app { grid-template-columns: 1fr; }
      .left-nav { display: none; }
      .top-bar { display: flex; }
      .bottom-nav { display: flex; }
      .main { padding: 0 0 90px; }
      .post { border-radius: 0; border-left: none; border-right: none; margin-bottom: 12px; }
    }
  </style>
</head>
<body>
  <!-- Auth Screen -->
  <div id="authScreen" style="display:none; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px;">
    <div class="modal" style="max-width:400px;">
      <div style="text-align:center; padding:24px 20px 0;">
        <div class="logo" style="justify-content:center; font-size:28px;">
          <svg viewBox="0 0 32 32" fill="none" width="36" height="36">
            <circle cx="16" cy="16" r="15" stroke="#d4af37" stroke-width="1.5"/>
            <path d="M8 18c2-6 6-8 8-8s6 2 8 8" stroke="#d4af37" stroke-width="2" stroke-linecap="round" fill="none"/>
            <circle cx="16" cy="12" r="2.5" fill="#d4af37"/>
          </svg>
          <span>VUSLAT</span>
        </div>
        <p style="color:var(--text-secondary); margin-top:8px; font-size:14px;">Bir araya gelmenin en güzel hali</p>
      </div>
      <div class="modal-body">
        <div id="loginForm">
          <input class="auth-input" id="loginUsername" placeholder="Kullanıcı adı" autocomplete="username">
          <input class="auth-input" id="loginPassword" type="password" placeholder="Şifre" autocomplete="current-password">
          <button class="auth-btn" id="loginBtn">Giriş Yap</button>
          <div class="auth-switch">Hesabın yok mu? <span id="showRegister">Kayıt Ol</span></div>
        </div>
        <div id="registerForm" style="display:none;">
          <input class="auth-input" id="regName" placeholder="Ad Soyad">
          <input class="auth-input" id="regUsername" placeholder="Kullanıcı adı">
          <input class="auth-input" id="regPassword" type="password" placeholder="Şifre">
          <button class="auth-btn" id="registerBtn">Kayıt Ol</button>
          <div class="auth-switch">Zaten hesabın var mı? <span id="showLogin">Giriş Yap</span></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Main App -->
  <div class="app" id="mainApp" style="display:none;">
    <aside class="left-nav">
      <div class="logo">
        <svg viewBox="0 0 32 32" fill="none" width="32" height="32">
          <circle cx="16" cy="16" r="15" stroke="#d4af37" stroke-width="1.5"/>
          <path d="M8 18c2-6 6-8 8-8s6 2 8 8" stroke="#d4af37" stroke-width="2" stroke-linecap="round" fill="none"/>
          <circle cx="16" cy="12" r="2.5" fill="#d4af37"/>
          <path d="M12 22h8" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
        <span>VUSLAT</span>
      </div>
      <nav style="margin-top:32px; display:flex; flex-direction:column; gap:4px;">
        <a class="nav-item active" data-page="home"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>Ana Sayfa</a>
        <a class="nav-item" data-page="explore"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>Keşfet</a>
        <a class="nav-item" data-page="messages"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>Mesajlar</a>
        <a class="nav-item" data-page="notifications"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>Bildirimler</a>
        <a class="nav-item" data-page="profile"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>Profil</a>
      </nav>
      <button class="create-btn" id="createBtn"><svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>Oluştur</button>
      <button class="logout-btn" id="logoutBtn">Çıkış Yap</button>
    </aside>

    <main class="main">
      <div class="top-bar">
        <div class="logo" style="font-size:20px;">
          <svg viewBox="0 0 32 32" fill="none" width="28" height="28"><circle cx="16" cy="16" r="15" stroke="#d4af37" stroke-width="1.5"/><path d="M8 18c2-6 6-8 8-8s6 2 8 8" stroke="#d4af37" stroke-width="2" stroke-linecap="round" fill="none"/><circle cx="16" cy="12" r="2.5" fill="#d4af37"/></svg>
          <span>VUSLAT</span>
        </div>
      </div>

      <div id="page-home" class="page-content active">
        <div class="stories" id="stories"></div>
        <div id="feed"></div>
      </div>

      <div id="page-explore" class="page-content">
        <div class="search-bar"><input type="text" id="searchInput" placeholder="Kullanıcı veya gönderi ara..."></div>
        <div class="explore-grid" id="exploreGrid"></div>
      </div>

      <div id="page-messages" class="page-content">
        <h2 style="padding:16px;font-size:20px;">Mesajlar</h2>
        <div id="messagesList"></div>
      </div>

      <div id="page-notifications" class="page-content">
        <h2 style="padding:16px;font-size:20px;">Bildirimler</h2>
        <div id="notificationsList"></div>
      </div>

      <div id="page-profile" class="page-content">
        <div class="profile-page" id="profileContent"></div>
      </div>
    </main>

    <aside class="right-sidebar">
      <div class="profile-card" id="sidebarProfile"></div>
      <div class="suggestions">
        <h3 style="font-size:15px;margin-bottom:12px;color:var(--text-secondary);">Senin için öneriler</h3>
        <div id="suggestions"></div>
      </div>
    </aside>
  </div>

  <nav class="bottom-nav">
    <a class="nav-item active" data-page="home"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>Ana Sayfa</a>
    <a class="nav-item" data-page="explore"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>Keşfet</a>
    <a class="nav-item" data-page="create"><svg fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>Oluştur</a>
    <a class="nav-item" data-page="messages"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>Mesaj</a>
    <a class="nav-item" data-page="profile"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>Profil</a>
  </nav>

  <!-- Modals -->
  <div class="modal-overlay" id="commentModal">
    <div class="modal">
      <div class="modal-header"><span>Yorumlar</span><button class="modal-close" id="closeModal">&times;</button></div>
      <div class="modal-body" id="modalComments"></div>
      <div class="comment-input-area">
        <input type="text" class="comment-input" id="modalCommentInput" placeholder="Yorum yaz...">
        <button class="send-comment" id="modalSendComment">Gönder</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="createModal">
    <div class="modal">
      <div class="modal-header"><span>Yeni Gönderi</span><button class="modal-close" id="closeCreate">&times;</button></div>
      <div class="modal-body">
        <input class="auth-input" id="createImage" placeholder="Görsel URL (opsiyonel)">
        <textarea class="auth-input" style="min-height:100px;resize:none;" placeholder="Bir şeyler paylaş..." id="createCaption"></textarea>
        <button class="auth-btn" id="publishBtn">Paylaş</button>
      </div>
    </div>
  </div>

  <div class="story-viewer" id="storyViewer">
    <div class="story-progress" id="storyProgress"></div>
    <button class="story-close" id="closeStory">&times;</button>
    <div class="story-header" id="storyHeader"></div>
    <div class="story-content" id="storyContent"></div>
    <div class="story-nav prev" id="storyPrev"></div>
    <div class="story-nav next" id="storyNext"></div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    // Storage helpers
    const storage = {
      get: (key, def) => { try { return JSON.parse(localStorage.getItem(key)) ?? def; } catch { return def; } },
      set: (key, val) => localStorage.setItem(key, JSON.stringify(val))
    };

    // Seed data
    if (!storage.get('vuslat_users')) {
      storage.set('vuslat_users', [
        { username: 'bilal', name: 'Bilal', password: '123456', avatar: 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=200&h=200&fit=crop&crop=face', bio: 'VUSLAT kurucusu ✨' },
        { username: 'elif', name: 'Elif Demir', password: '123456', avatar: 'https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=150&h=150&fit=crop&crop=face', bio: 'Gün batımı aşığı' },
        { username: 'ahmet', name: 'Ahmet Kaya', password: '123456', avatar: 'https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=150&h=150&fit=crop&crop=face', bio: 'Yaratıcı ruh' }
      ]);
    }
    if (!storage.get('vuslat_posts')) {
      storage.set('vuslat_posts', [
        { id: 1, username: 'elif', image: 'https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=800&h=800&fit=crop', caption: 'İstanbul’da gün batımı… Vuslat anı gibi bir manzara. ✨', likes: ['ahmet'], comments: [{user:'ahmet', text:'Muhteşem!'}], time: Date.now() - 7200000 },
        { id: 2, username: 'ahmet', image: 'https://images.unsplash.com/photo-1519681393784-d120267933ba?w=800&h=800&fit=crop', caption: 'Yeni projeler yolda. VUSLAT’ta paylaşacağız.', likes: ['bilal'], comments: [], time: Date.now() - 18000000 },
        { id: 3, username: 'elif', image: 'https://images.unsplash.com/photo-1469474968028-56623f02e42e?w=800&h=800&fit=crop', caption: 'Doğanın içinde huzur. Herkese iyi haftalar.', likes: [], comments: [], time: Date.now() - 86400000 }
      ]);
    }
    if (!storage.get('vuslat_follows')) storage.set('vuslat_follows', { bilal: ['elif','ahmet'], elif: ['bilal'], ahmet: ['bilal'] });
    if (!storage.get('vuslat_notifications')) storage.set('vuslat_notifications', {});

    let currentUser = storage.get('vuslat_currentUser', null);
    let posts = storage.get('vuslat_posts', []);
    let users = storage.get('vuslat_users', []);
    let follows = storage.get('vuslat_follows', {});
    let notifications = storage.get('vuslat_notifications', {});

    function saveAll() {
      storage.set('vuslat_posts', posts);
      storage.set('vuslat_users', users);
      storage.set('vuslat_follows', follows);
      storage.set('vuslat_notifications', notifications);
      if (currentUser) storage.set('vuslat_currentUser', currentUser);
    }

    function getUser(username) { return users.find(u => u.username === username); }
    function getFollowers(username) { return Object.keys(follows).filter(u => follows[u]?.includes(username)).length; }
    function getFollowing(username) { return (follows[username] || []).length; }
    function isFollowing(a, b) { return (follows[a] || []).includes(b); }

    function addNotification(to, text) {
      if (!notifications[to]) notifications[to] = [];
      notifications[to].unshift({ text, time: Date.now() });
      saveAll();
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2500);
    }

    function timeAgo(ts) {
      const s = Math.floor((Date.now() - ts) / 1000);
      if (s < 60) return 'az önce';
      if (s < 3600) return Math.floor(s/60) + ' dk';
      if (s < 86400) return Math.floor(s/3600) + ' sa';
      return Math.floor(s/86400) + ' gün';
    }

    // Auth
    function showAuth() {
      document.getElementById('authScreen').style.display = 'flex';
      document.getElementById('mainApp').style.display = 'none';
    }
    function showApp() {
      document.getElementById('authScreen').style.display = 'none';
      document.getElementById('mainApp').style.display = 'grid';
      renderAll();
    }

    document.getElementById('showRegister').onclick = () => {
      document.getElementById('loginForm').style.display = 'none';
      document.getElementById('registerForm').style.display = 'block';
    };
    document.getElementById('showLogin').onclick = () => {
      document.getElementById('registerForm').style.display = 'none';
      document.getElementById('loginForm').style.display = 'block';
    };

    document.getElementById('loginBtn').onclick = () => {
      const u = document.getElementById('loginUsername').value.trim().toLowerCase();
      const p = document.getElementById('loginPassword').value;
      const user = users.find(x => x.username === u && x.password === p);
      if (user) {
        currentUser = { username: user.username, name: user.name, avatar: user.avatar, bio: user.bio || '' };
        saveAll();
        showApp();
        showToast('Hoş geldin, ' + user.name);
      } else showToast('Kullanıcı adı veya şifre hatalı');
    };

    document.getElementById('registerBtn').onclick = () => {
      const name = document.getElementById('regName').value.trim();
      const u = document.getElementById('regUsername').value.trim().toLowerCase();
      const p = document.getElementById('regPassword').value;
      if (!name || !u || !p) return showToast('Tüm alanları doldur');
      if (users.find(x => x.username === u)) return showToast('Bu kullanıcı adı alınmış');
      const newUser = { username: u, name, password: p, avatar: 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=200&h=200&fit=crop&crop=face', bio: '' };
      users.push(newUser);
      currentUser = { username: u, name, avatar: newUser.avatar, bio: '' };
      follows[u] = [];
      saveAll();
      showApp();
      showToast('Kayıt başarılı! Hoş geldin');
    };

    document.getElementById('logoutBtn').onclick = () => {
      currentUser = null;
      localStorage.removeItem('vuslat_currentUser');
      showAuth();
    };

    // Rendering
    function renderStories() {
      const container = document.getElementById('stories');
      const list = [{username: currentUser.username, name: 'Hikayen', avatar: currentUser.avatar}, ...users.filter(u => u.username !== currentUser.username).slice(0,5)];
      container.innerHTML = list.map((s,i) => `
        <div class="story" data-index="${i}">
          <div class="story-ring"><img class="story-avatar" src="${s.avatar}"></div>
          <span class="story-name">${s.name || s.username}</span>
        </div>
      `).join('');
    }

    function renderFeed() {
      const container = document.getElementById('feed');
      const sorted = [...posts].sort((a,b) => b.time - a.time);
      container.innerHTML = sorted.map(post => {
        const user = getUser(post.username) || {name: post.username, avatar: ''};
        const liked = post.likes.includes(currentUser.username);
        return `
          <article class="post">
            <div class="post-header">
              <img class="post-avatar" src="${user.avatar}">
              <div><div class="post-user">${user.name}</div><div style="font-size:13px;color:var(--text-secondary);">@${post.username}</div></div>
              <span class="post-time">${timeAgo(post.time)}</span>
            </div>
            <img class="post-image" src="${post.image}">
            <div class="post-actions">
              <button class="action-btn like-btn ${liked?'liked':''}" data-id="${post.id}">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="${liked?'currentColor':'none'}" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
                ${post.likes.length}
              </button>
              <button class="action-btn comment-btn" data-id="${post.id}">
                <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
                ${post.comments.length}
              </button>
              <button class="action-btn share-btn" data-id="${post.id}">
                <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg>
              </button>
            </div>
            <div class="post-likes">${post.likes.length} beğeni</div>
            <div class="post-caption"><strong>${user.name}</strong> ${post.caption}</div>
            <div class="comment-input-area">
              <input type="text" class="comment-input" placeholder="Yorum ekle..." data-id="${post.id}">
              <button class="send-comment" data-id="${post.id}">Gönder</button>
            </div>
          </article>`;
      }).join('');
    }

    function renderSidebar() {
      const u = getUser(currentUser.username);
      document.getElementById('sidebarProfile').innerHTML = `
        <img class="profile-avatar" src="${currentUser.avatar}">
        <div class="profile-name">${currentUser.name}</div>
        <div class="profile-handle">@${currentUser.username}</div>
        <div class="profile-stats">
          <div><strong>${posts.filter(p=>p.username===currentUser.username).length}</strong> Gönderi</div>
          <div><strong>${getFollowers(currentUser.username)}</strong> Takipçi</div>
          <div><strong>${getFollowing(currentUser.username)}</strong> Takip</div>
        </div>`;
      const others = users.filter(u => u.username !== currentUser.username).slice(0,4);
      document.getElementById('suggestions').innerHTML = others.map(s => `
        <div class="suggestion-item">
          <img class="suggestion-avatar" src="${s.avatar}">
          <div style="flex:1;"><strong>${s.name}</strong><div style="font-size:12px;color:var(--text-secondary);">@${s.username}</div></div>
          <button class="follow-btn" data-user="${s.username}">${isFollowing(currentUser.username, s.username) ? 'Takip Ediliyor' : 'Takip Et'}</button>
        </div>`).join('');
    }

    function renderExplore() {
      const grid = document.getElementById('exploreGrid');
      grid.innerHTML = posts.map(p => `<div class="explore-item"><img src="${p.image}"></div>`).join('');
    }

    function renderMessages() {
      const list = document.getElementById('messagesList');
      const others = users.filter(u => u.username !== currentUser.username);
      list.innerHTML = others.map(u => `
        <div class="chat-item">
          <img src="${u.avatar}" style="width:48px;height:48px;border-radius:50%;object-fit:cover;">
          <div style="flex:1;"><div style="font-weight:700;">${u.name}</div><div style="font-size:13px;color:var(--text-secondary);">Mesaj gönder...</div></div>
        </div>`).join('');
    }

    function renderNotifications() {
      const list = document.getElementById('notificationsList');
      const notifs = notifications[currentUser.username] || [];
      list.innerHTML = notifs.length ? notifs.map(n => `
        <div style="padding:14px 16px;border-bottom:1px solid var(--border);">
          <div>${n.text}</div>
          <div style="font-size:12px;color:var(--text-secondary);margin-top:4px;">${timeAgo(n.time)}</div>
        </div>`).join('') : '<div style="padding:40px;text-align:center;color:var(--text-secondary);">Henüz bildirim yok</div>';
    }

    function renderProfile() {
      const u = getUser(currentUser.username);
      const myPosts = posts.filter(p => p.username === currentUser.username);
      document.getElementById('profileContent').innerHTML = `
        <div class="profile-header">
          <img src="${currentUser.avatar}">
          <div>
            <div style="font-size:22px;font-weight:800;">${currentUser.name}</div>
            <div style="color:var(--text-secondary);">@${currentUser.username}</div>
            <div style="margin-top:8px;font-size:14px;">${currentUser.bio || 'Biyografi ekle'}</div>
          </div>
        </div>
        <div class="profile-stats" style="padding:0 16px 20px;justify-content:flex-start;gap:24px;">
          <div><strong>${myPosts.length}</strong> gönderi</div>
          <div><strong>${getFollowers(currentUser.username)}</strong> takipçi</div>
          <div><strong>${getFollowing(currentUser.username)}</strong> takip</div>
        </div>
        <div class="profile-posts">${myPosts.map(p => `<img src="${p.image}">`).join('')}</div>`;
    }

    function renderAll() {
      renderStories();
      renderFeed();
      renderSidebar();
    }

    function showPage(page) {
      document.querySelectorAll('.page-content').forEach(el => el.classList.remove('active'));
      const target = document.getElementById('page-' + page);
      if (target) target.classList.add('active');
      document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
      document.querySelectorAll(`.nav-item[data-page="${page}"]`).forEach(el => el.classList.add('active'));
      if (page === 'explore') renderExplore();
      if (page === 'messages') renderMessages();
      if (page === 'notifications') renderNotifications();
      if (page === 'profile') renderProfile();
      if (page === 'home') renderAll();
    }

    // Interactions
    document.addEventListener('click', e => {
      if (e.target.closest('.like-btn')) {
        const id = +e.target.closest('.like-btn').dataset.id;
        const post = posts.find(p => p.id === id);
        if (!post) return;
        const idx = post.likes.indexOf(currentUser.username);
        if (idx === -1) {
          post.likes.push(currentUser.username);
          if (post.username !== currentUser.username) addNotification(post.username, `${currentUser.name} gönderini beğendi`);
        } else post.likes.splice(idx, 1);
        saveAll();
        renderFeed();
      }
      if (e.target.closest('.comment-btn')) {
        const id = +e.target.closest('.comment-btn').dataset.id;
        openComments(id);
      }
      if (e.target.closest('.send-comment') && !e.target.closest('#modalSendComment')) {
        const id = +e.target.closest('.send-comment').dataset.id;
        const input = document.querySelector(`.comment-input[data-id="${id}"]`);
        const text = input?.value.trim();
        if (text) {
          const post = posts.find(p => p.id === id);
          post.comments.push({user: currentUser.username, text});
          if (post.username !== currentUser.username) addNotification(post.username, `${currentUser.name} yorum yaptı: ${text.slice(0,40)}`);
          input.value = '';
          saveAll();
          renderFeed();
          showToast('Yorum eklendi');
        }
      }
      if (e.target.closest('.follow-btn')) {
        const target = e.target.closest('.follow-btn').dataset.user;
        if (!follows[currentUser.username]) follows[currentUser.username] = [];
        const arr = follows[currentUser.username];
        const idx = arr.indexOf(target);
        if (idx === -1) {
          arr.push(target);
          addNotification(target, `${currentUser.name} seni takip etmeye başladı`);
        } else arr.splice(idx, 1);
        saveAll();
        renderSidebar();
        showToast(idx === -1 ? 'Takip edildi' : 'Takip bırakıldı');
      }
      if (e.target.closest('.nav-item')) {
        const page = e.target.closest('.nav-item').dataset.page;
        if (page === 'create') { document.getElementById('createModal').classList.add('active'); return; }
        if (page) showPage(page);
      }
      if (e.target.closest('.story')) {
        showToast('Hikaye görüntüleyici aktif');
      }
    });

    document.getElementById('createBtn').onclick = () => document.getElementById('createModal').classList.add('active');
    document.getElementById('closeCreate').onclick = () => document.getElementById('createModal').classList.remove('active');
    document.getElementById('publishBtn').onclick = () => {
      const caption = document.getElementById('createCaption').value.trim();
      const img = document.getElementById('createImage').value.trim() || 'https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=800&h=800&fit=crop';
      if (!caption) return showToast('Açıklama yaz');
      posts.unshift({ id: Date.now(), username: currentUser.username, image: img, caption, likes: [], comments: [], time: Date.now() });
      saveAll();
      document.getElementById('createModal').classList.remove('active');
      document.getElementById('createCaption').value = '';
      showPage('home');
      showToast('Gönderi paylaşıldı!');
    };

    function openComments(id) {
      const post = posts.find(p => p.id === id);
      document.getElementById('modalComments').innerHTML = post.comments.length
        ? post.comments.map(c => `<div style="margin-bottom:12px;"><strong>${getUser(c.user)?.name || c.user}</strong> ${c.text}</div>`).join('')
        : '<div style="color:var(--text-secondary);text-align:center;">Henüz yorum yok</div>';
      document.getElementById('commentModal').classList.add('active');
      document.getElementById('modalSendComment').onclick = () => {
        const text = document.getElementById('modalCommentInput').value.trim();
        if (text) {
          post.comments.push({user: currentUser.username, text});
          saveAll();
          openComments(id);
          renderFeed();
          document.getElementById('modalCommentInput').value = '';
        }
      };
    }
    document.getElementById('closeModal').onclick = () => document.getElementById('commentModal').classList.remove('active');

    // Init
    if (currentUser) showApp();
    else showAuth();
  </script>
</body>
</html>
