function makeArt(c1, c2, t1, t2) {
  var s = '<svg xmlns="http://w3.org"' +
    ' width="600" height="600">' +
    '<defs><linearGradient id="g">' +
    '<stop offset="0%" stop-color="' + c1 + '"/>' +
    '<stop offset="100%" stop-color="' + c2 + '"/>' +
    '</linearGradient></defs>' +
    '<rect width="600" height="600" fill="url(#g)"/>' +
    '<text x="50%" y="48%" text-anchor="middle"' +
    ' fill="#fff" font-size="38"' +
    ' font-family="sans-serif" font-weight="bold">' +
    t1 + '</text>' +
    '<text x="50%" y="56%" text-anchor="middle"' +
    ' fill="#eee" font-size="20"' +
    ' font-family="sans-serif">' +
    t2 + '</text></svg>';
  return 'data:image/svg+xml;utf8,' +
    encodeURIComponent(s);
}

function makeAv(c1, c2, ch) {
  var s = '<svg xmlns="http://w3.org"' +
    ' width="150" height="150">' +
    '<rect width="150" height="150" fill="' + c1 + '"/>' +
    '<text x="50%" y="55%" text-anchor="middle"' +
    ' fill="#fff" font-size="64"' +
    ' font-family="sans-serif" font-weight="bold">' +
    ch + '</text></svg>';
  return 'data:image/svg+xml;utf8,' +
    encodeURIComponent(s);
}

function fixHeader() {
  var h = document.querySelector(
    '.mobile-header div');
  if (h) {
    h.innerHTML =
      '<svg width="28" height="28">' +
      '<use href="#vuslat-logo"/></svg>' +
      '<span style="font-size:19px;' +
      'font-weight:800;letter-spacing:1.5px;' +
      'background:linear-gradient(135deg,' +
      '#6366f1,#ec4899,#f59e0b);' +
      '-webkit-background-clip:text;' +
      '-webkit-text-fill-color:transparent;">' +
      'VUSLAT</span>';
  }
  var p1 = document.querySelector(
    '.profile-page-avatar');
  if (p1) p1.src = currentUser.avatar;
  var p2 = document.querySelector(
    '.profile-summary-avatar');
  if (p2) p2.src = currentUser.avatar;
}

function renderStories() {
  var el = document.getElementById(
    'stories-container');
  if (!el) return;
  el.innerHTML = storiesData.map(function(s) {
    var r = s.seen ?
      'story-ring seen' : 'story-ring';
    var b = s.isOwn ?
      '<span class="story-add-badge">+</span>'
      : '';
    return '<div class="story-item"' +
      ' onclick="openStory(' + s.id + ')">' +
      '<div class="' + r + '">' +
      '<img src="' + s.avatar + '">' + b +
      '</div><span class="story-username">' +
      s.username + '</span></div>';
  }).join('');
}

function renderSuggestions() {
  var el = document.getElementById(
    'suggestions-container');
  if (!el) return;
  el.innerHTML = suggestionsData.map(
    function(u, i) {
      var c = u.following ?
        'follow-btn following' : 'follow-btn';
      var t = u.following ?
        'Takiptesin' : 'Takip Et';
      return '<div class="suggestion-item">' +
        '<div class="suggestion-left">' +
        '<img src="' + u.avatar +
        '" class="suggestion-avatar"><div>' +
        '<div style="font-size:13px;' +
        'font-weight:700;">' + u.username +
        '</div><div style="font-size:11px;' +
        'color:var(--text-secondary);">' +
        u.subtitle + '</div></div></div>' +
        '<button class="' + c +
        '" onclick="toggleFollow(' + i + ')">' +
        t + '</button></div>';
    }).join('');
}
function renderFeed() {
  var el = document.getElementById(
    'feed-container');
  if (!el) return;
  el.innerHTML = postsData.map(function(p) {
    var lk = p.liked ?
      'action-btn liked' : 'action-btn';
    var sv = p.saved ?
      'action-btn saved' : 'action-btn';
    var cm = p.comments.map(function(c, i) {
      var dl = c.user === currentUser.username ?
        '<button class="delete-comment-btn"' +
        ' onclick="deleteComment(' + p.id +
        ',' + i + ')">Sil</button>' : '';
      return '<div class="comment-item">' +
        '<span><strong>' + c.user +
        '</strong> ' + c.text + '</span>' +
        dl + '</div>';
    }).join('');
    return '<article class="post-card">' +
      '<div class="post-header">' +
      '<div class="post-user">' +
      '<img src="' + p.avatar +
      '" class="post-avatar"><div>' +
      '<span class="post-username">' +
      p.username + '</span>' +
      '<span class="post-location">' +
      p.location + '</span></div></div>' +
      '<button onclick="showToast(' +
      '\'Seçenekler\')">•••</button></div>' +
      '<div class="post-media"' +
      ' ondblclick="handleDoubleTap(' +
      p.id + ')"><img src="' + p.image + '">' +
      '<svg class="double-tap-heart"' +
      ' id="heart-anim-' + p.id + '"' +
      ' viewBox="0 0 24 24"' +
      ' fill="currentColor">' +
      '<path d="M20.84 4.61a5.5 5.5 0 ' +
      '0 0-7.78 0L12 5.67l-1.06-1.06a5.5 ' +
      '5.5 0 0 0-7.78 7.78l1.06 1.06L12 ' +
      '21.23l7.78-7.78 1.06-1.06a5.5 5.5 ' +
      '0 0 0 0-7.78z"/></svg></div>' +
      '<div class="post-actions">' +
      '<div class="post-actions-left">' +
      '<button class="' + lk + '"' +
      ' onclick="toggleLike(' + p.id + ')">' +
      '❤️</button>' +
      '<button class="action-btn"' +
      ' onclick="focusComm(' + p.id + ')">' +
      '💬</button>' +
      '<button class="action-btn"' +
      ' onclick="sharePost(\'' + p.username +
      '\')">📤</button></div>' +
      '<button class="' + sv + '"' +
      ' onclick="toggleSave(' + p.id + ')">' +
      '🔖</button></div>' +
      '<div class="post-body">' +
      '<div class="post-likes">' + p.likes +
      ' beğenme</div>' +
      '<div class="post-caption"><strong>' +
      p.username + '</strong> ' + p.caption +
      '</div><div class="post-time">' +
      p.time + '</div><div>' + cm +
      '</div></div>' +
      '<form class="comment-form"' +
      ' onsubmit="addComment(event,' +
      p.id + ')"><input type="text"' +
      ' id="comment-input-' + p.id + '"' +
      ' class="comment-input"' +
      ' placeholder="Yorum ekle..."' +
      ' oninput="toggleSubmitBtn(this)">' +
      '<button type="submit"' +
      ' class="comment-submit">Paylaş</button>' +
      '</form></article>';
  }).join('');
}

function focusComm(id) {
  var i = document.getElementById(
    'comment-input-' + id);
  if (i) i.focus();
}
function renderProfileAndExplore() {
  var my = postsData.filter(function(p) {
    return p.username === currentUser.username;
  });
  var list = my.length > 0 ? my : postsData;
  var cEl = document.getElementById(
    'profile-post-count');
  var gEl = document.getElementById(
    'profile-grid');
  if (cEl) cEl.textContent = list.length;
  if (gEl) {
    gEl.innerHTML = list.map(function(p) {
      return '<div class="grid-item"' +
        ' onclick="switchView(\'home\')">' +
        '<img src="' + p.image + '">' +
        '<div class="grid-overlay"><span>❤️ ' +
        p.likes + '</span></div></div>';
    }).join('');
  }
  renderExplore('');
}

function renderExplore(q) {
  var el = document.getElementById(
    'explore-grid');
  if (!el) return;
  var qr = (q || '').toLowerCase().trim();
  var ex = presetPhotos.map(function(im, i) {
    return {
      image: im,
      likes: 300 + i * 80,
      username: 'vuslat',
      location: 'Türkiye'
    };
  });
  var pool = postsData.concat(ex);
  var flt = pool.filter(function(item) {
    return item.username.toLowerCase()
      .indexOf(qr) > -1 ||
      (item.location && item.location
      .toLowerCase().indexOf(qr) > -1);
  });
  el.innerHTML = flt.map(function(p) {
    return '<div class="grid-item"' +
      ' onclick="switchView(\'home\')">' +
      '<img src="' + p.image + '">' +
      '<div class="grid-overlay"><span>❤️ ' +
      p.likes + '</span></div></div>';
  }).join('');
}

function renderNotifications() {
  var el = document.getElementById(
    'notifications-list');
  if (!el) return;
  el.innerHTML =
    '<div style="font-size:13px;">' +
    '<strong>kerem.kaya</strong> gönderini' +
    ' beğendi. <span style="color:gray;">' +
    '12 dk</span></div>' +
    '<div style="font-size:13px;">' +
    '<strong>selin.arslan</strong> yorum' +
    ' yaptı: Harika kare ✨</div>';
}

function toggleLike(id) {
  var p = postsData.find(function(x) {
    return x.id === id;
  });
  if (!p) return;
  p.liked = !p.liked;
  p.likes += p.liked ? 1 : -1;
  renderFeed();
}

function handleDoubleTap(id) {
  var p = postsData.find(function(x) {
    return x.id === id;
  });
  if (!p) return;
  if (!p.liked) {
    p.liked = true;
    p.likes += 1;
    renderFeed();
  }
  var h = document.getElementById(
    'heart-anim-' + id);
  if (h) {
    h.classList.remove('animate');
    void h.offsetWidth;
    h.classList.add('animate');
  }
}

function toggleSave(id) {
  var p = postsData.find(function(x) {
    return x.id === id;
  });
  if (!p) return;
  p.saved = !p.saved;
  renderFeed();
  showToast(p.saved ?
    'Kaydedildi' : 'Çıkarıldı');
}

function toggleSubmitBtn(inp) {
  inp.nextElementSibling.classList.toggle(
    'active', inp.value.trim().length > 0);
}

function addComment(e, id) {
  e.preventDefault();
  var inp = document.getElementById(
    'comment-input-' + id);
  var txt = inp.value.trim();
  if (!txt) return;
  var p = postsData.find(function(x) {
    return x.id === id;
  });
  if (p) {
    p.comments.push({
      user: currentUser.username,
      text: txt
    });
    renderFeed();
    showToast('Yorum paylaşıldı');
  }
}

function deleteComment(id, idx) {
  var p = postsData.find(function(x) {
    return x.id === id;
  });
  if (p) {
    p.comments.splice(idx, 1);
    renderFeed();
    showToast('Yorum silindi');
  }
}

function sharePost(user) {
  showToast('@' + user + ' kopyalandı!');
}

function toggleFollow(i) {
  suggestionsData[i].following =
    !suggestionsData[i].following;
  renderSuggestions();
  showToast(suggestionsData[i].following ?
    'Takip edildi' : 'Takipten çıkıldı');
}

function switchView(view, e) {
  if (e) e.preventDefault();
  document.querySelectorAll('.view-section')
    .forEach(function(s) {
      s.classList.remove('active');
    });
  var t = document.getElementById(
    'view-' + view);
  if (t) t.classList.add('active');
  document.querySelectorAll('.nav-item')
    .forEach(function(b) {
      b.classList.toggle('active',
        b.getAttribute('data-view') === view);
    });
  if (view === 'profile' || view === 'explore') {
    renderProfileAndExplore();
  }
  if (view === 'notifications') {
    renderNotifications();
  }
  window.scrollTo({ top: 0 });
}

function toggleTheme() {
  var h = document.documentElement;
  var d = h.getAttribute('data-theme') === 'dark';
  h.setAttribute('data-theme',
    d ? 'light' : 'dark');
}

function openCreateModal() {
  var box = document.getElementById(
    'preset-images');
  box.innerHTML = presetPhotos.map(
    function(u, i) {
      var c = i === 0 ?
        'preset-thumb selected' :
        'preset-thumb';
      return '<div class="' + c + '"' +
        ' onclick="selectPreset(this,\'' +
        u + '\')"><img src="' + u +
        '"></div>';
    }).join('');
  document.getElementById('new-post-img')
    .value = presetPhotos[0];
  document.getElementById('create-modal')
    .classList.add('open');
}

function selectPreset(el, url) {
  document.querySelectorAll('.preset-thumb')
    .forEach(function(t) {
      t.classList.remove('selected');
    });
  el.classList.add('selected');
  document.getElementById('new-post-img')
    .value = url;
}

function closeCreateModal() {
  document.getElementById('create-modal')
    .classList.remove('open');
}

function publishNewPost() {
  var img = document.getElementById(
    'new-post-img').value.trim();
  var loc = document.getElementById(
    'new-post-location').value.trim();
  var cap = document.getElementById(
    'new-post-caption').value.trim();
  if (!img) return showToast('Görsel seçin');
  postsData.unshift({
    id: Date.now(),
    username: currentUser.username,
    location: loc || 'İstanbul',
    avatar: currentUser.avatar,
    image: img,
    likes: 1,
    liked: true,
    saved: false,
    caption: cap || 'VUSLAT yeni anı ✨',
    time: 'AZ ÖNCE',
    comments: []
  });
  renderFeed();
  renderProfileAndExplore();
  closeCreateModal();
  switchView('home');
  showToast('Gönderin yayınlandı!');
}

var storyTimer = null;
function openStory(id) {
  var s = storiesData.find(function(x) {
    return x.id === id;
  });
  if (!s) return;
  s.seen = true;
  renderStories();
  document.getElementById(
    'story-modal-avatar').src = s.avatar;
  document.getElementById(
    'story-modal-user').textContent = s.username;
  document.getElementById(
    'story-modal-img').src = s.storyImg;
  document.getElementById('story-modal')
    .classList.add('open');
  var p = document.getElementById(
    'story-progress');
  p.style.transition = 'none';
  p.style.width = '0%';
  setTimeout(function() {
    p.style.transition = 'width 4s linear';
    p.style.width = '100%';
  }, 30);
  clearTimeout(storyTimer);
  storyTimer = setTimeout(closeStoryModal, 4100);
}

function closeStoryModal() {
  clearTimeout(storyTimer);
  document.getElementById('story-modal')
    .classList.remove('open');
}

function showToast(msg) {
  var t = document.getElementById('toast');
  if (!t) return;
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(window.toastTimeout);
  window.toastTimeout = setTimeout(function() {
    t.classList.remove('show');
  }, 2500);
}

document.addEventListener('DOMContentLoaded',
  function() {
    fixHeader();
    renderStories();
    renderFeed();
    renderSuggestions();
    renderProfileAndExplore();
    renderNotifications();
  });
</script>
